<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>小二複習樂園｜國語・數學</title>
<style>
:root{
  --kai:"TW-Kai","BiauKai","DFKai-SB","標楷體","Kaiti TC","STKaiti","Noto Serif CJK TC","Noto Serif TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",serif;
  --zyfont:"Noto Sans CJK TC","Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
  --bpmf-font:"BpmfGenSenRounded";
  --bg:#fff8ec; --ink:#3b3355; --pri:#ff8a65; --blue:#5b8def; --green:#43b581; --red:#ef6f6c;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--kai);-webkit-tap-highlight-color:transparent}
body{background-image:radial-gradient(#ffe2c4 1.5px,transparent 1.5px);background-size:28px 28px;min-height:100vh}
#app{max-width:960px;margin:0 auto;padding:18px 18px 60px}
button{font-family:inherit;color:inherit;cursor:pointer;border:none}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.hidden{display:none!important}

/* ---- 注音：右側直排 ---- */
.zc{display:inline-flex;align-items:center;vertical-align:middle;margin:0 .03em;line-height:1}
.zh{display:inline-block;line-height:1.15}
.zb{display:inline-flex;flex-direction:column;justify-content:center;align-items:center;font-family:var(--zyfont);font-size:.34em;line-height:1;width:1.05em;margin:0 .5em 0 .1em;height:3.2em;font-weight:normal}
.zr{position:relative;display:block}
.zt{position:absolute;left:100%;top:-.35em;margin-left:.02em}
.zl{display:block;line-height:.5;margin-bottom:.1em}
ruby{ruby-position:over}
rt{font-family:var(--zyfont);font-size:.36em;letter-spacing:.02em}
body.fontmode .fz{font-family:var(--bpmf-font),var(--kai)}
.nozy,body.fontmode .nozy{font-family:var(--kai)!important}

/* ---- 首頁 ---- */
.logo{font-size:52px;text-align:center;margin:18px 0 8px;color:#e8505b;text-shadow:3px 3px 0 #ffd6a5}
.chip{background:#fff;border:3px solid #ffd6a5;border-radius:999px;padding:8px 26px;font-size:30px;box-shadow:0 4px 0 #f3c99a}
.chip.small{font-size:26px;padding:6px 22px}
.chip.on{background:#ffb48a;border-color:#ff8a65;color:#fff;box-shadow:0 4px 0 #e0704f}
.chip.on .zb{color:#fff}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:26px 0}
.bigcard{border-radius:28px;padding:26px 18px;font-size:40px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 8px 0 rgba(0,0,0,.12);transition:transform .1s}
.bigcard:active,.opt:active,.chip:active,.next:active,.pill:active{transform:translateY(3px)}
.bigcard small{font-size:18px;opacity:.75;font-family:var(--zyfont)}
.bigcard .emoji{font-size:64px}
.bigcard.practice{background:#c8f0d8}
.bigcard.test{background:#cfe0ff}
.pill{background:#fff;border-radius:999px;padding:12px 26px;font-size:24px;box-shadow:0 4px 0 #e6d6c4}
.next{background:var(--pri);color:#fff;border-radius:999px;padding:12px 40px;font-size:30px;box-shadow:0 5px 0 #d9653f}
.next .zb{color:#fff}

.lessons{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;background:#fff;border-radius:20px;padding:12px;margin:6px 0}
.lessons .note{width:100%;text-align:center}
.lchip{background:#f3f0fa;border:3px solid #e1d9f3;border-radius:16px;padding:6px 12px;font-size:20px;display:flex;flex-direction:column;align-items:center;min-width:120px;font-family:var(--zyfont)}
.lchip small{font-size:14px;opacity:.8}
.lchip.on{background:#cfe0ff;border-color:var(--blue)}
/* ---- 作答畫面 ---- */
.topbar{display:flex;align-items:center;gap:14px;font-size:24px}
.iconbtn{background:#fff;border-radius:50%;width:56px;height:56px;font-size:28px;box-shadow:0 3px 0 #e6d6c4}
.progress{flex:1;height:16px;background:#fff;border-radius:999px;overflow:hidden;border:2px solid #ffd6a5}
.bar{height:100%;background:linear-gradient(90deg,#ffb48a,#ff8a65);transition:width .3s}
.stars{font-family:var(--zyfont);font-weight:bold}
.qcard{background:#fff;border-radius:28px;padding:22px 26px;margin:18px 0;box-shadow:0 6px 0 rgba(0,0,0,.07)}
.math .qcard{border-top:10px solid var(--blue)}
.chinese .qcard{border-top:10px solid var(--pri)}
.qtitle{font-size:32px;color:#7a6f96;margin-bottom:10px}
.qbody{text-align:center}
.sent{font-size:54px;line-height:1.5;text-align:left;display:inline-block}
.blank{display:inline-flex;align-items:center;justify-content:center;min-width:1.3em;height:1.35em;border:3px dashed var(--pri);border-radius:12px;margin:0 .08em;vertical-align:middle;background:#fff3ea}
.blank .zb{margin:0 .3em 0 0;color:#e8505b;font-size:.42em;font-weight:bold}
.blankch{width:0}
.target{color:#e8505b;font-weight:bold;border-bottom:4px solid #e8505b;padding:0 .05em;margin:0 .05em}
.vert{display:inline-grid;grid-template-columns:auto auto;column-gap:.4em;font-size:64px;font-family:var(--zyfont);text-align:right;line-height:1.2;letter-spacing:.12em}
.vert .line{grid-column:1/3;border-top:5px solid var(--ink);height:6px}
.bigexpr{font-size:64px;font-family:var(--zyfont);font-weight:bold;letter-spacing:.04em}
.clock{width:260px;height:260px}
.legend{font-size:18px;font-family:var(--zyfont)}
.coins{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;margin:8px 0}
.coin{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-family:var(--zyfont);font-weight:bold;background:radial-gradient(circle at 35% 35%,#f4f4f4,#b9bec5);border:3px solid #9aa0a8;color:#444}
.coin.c1{width:54px;height:54px;font-size:22px}.coin.c5{width:64px;height:64px;font-size:24px}.coin.c10{width:74px;height:74px;font-size:26px}
.coin.c50{width:80px;height:80px;font-size:28px;background:radial-gradient(circle at 35% 35%,#fff3b0,#e0b84a);border-color:#c49a2c}
.bill{display:inline-flex;align-items:center;justify-content:center;gap:4px;width:150px;height:76px;border-radius:10px;background:linear-gradient(135deg,#ffb3b3,#f07c7c);border:3px solid #d65c5c;color:#7a1f1f;font-size:32px;font-weight:bold;font-family:var(--zyfont)}
.bill small{font-size:18px}
.opts{display:grid;gap:16px;grid-template-columns:repeat(2,1fr)}
.opts.n3{grid-template-columns:repeat(3,1fr)}
.opt{background:#fff;border:4px solid #e9e2f5;border-radius:24px;min-height:96px;font-size:44px;padding:10px;box-shadow:0 5px 0 #ddd3ee;transition:transform .1s,background .2s}
.opt .plainopt{font-size:60px}
.zyopt{font-family:var(--zyfont)!important;font-size:48px;letter-spacing:.06em}
.opt.right{background:#d7f5e3;border-color:var(--green);box-shadow:0 5px 0 #34a16f}
.opt.wrong{background:#ffe7e6;border-color:#f3a6a4;box-shadow:0 5px 0 #e79391;opacity:.75}
.opt.picked{background:#fff1d6;border-color:#ffb48a}
.opt:disabled{cursor:default}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.sentopts{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:10px;background:#fff;border-radius:24px;padding:18px}
.opt.ch{min-height:100px;min-width:104px;font-size:54px;padding:6px 4px}
.punct{font-size:48px;align-self:center}
.feedback{min-height:20px;margin-top:18px;font-size:32px;text-align:center;border-radius:20px;padding:0 10px}
.feedback.good{background:#e3f8ec;padding:14px;color:#23784f}
.feedback.soft{background:#fff1e0;padding:14px;color:#a35a1c}
.explain{font-size:34px;margin-top:8px;color:var(--ink)}

/* ---- 結果 / 錯題 / 設定 ---- */
.results h1,.results h2{text-align:center}
.results h2{font-size:30px}
.scorecard{background:#fff;border-radius:30px;text-align:center;padding:24px;box-shadow:0 6px 0 rgba(0,0,0,.07)}
.scorecard .big{font-size:80px}
.score{font-size:96px;font-weight:bold;color:#e8505b;font-family:var(--zyfont)}
.score small{font-size:36px;font-family:var(--kai)}
.scorecard .sub{font-size:24px;font-family:var(--zyfont)}
.scorecard .msg{font-size:36px;margin-top:8px}
.wronglist{display:flex;flex-direction:column;gap:14px}
.witem{background:#fff;border-radius:20px;padding:14px 18px;border-left:8px solid #f3a6a4}
.wq{font-size:22px;color:#7a6f96}
.tag{background:#ffe9d6;border-radius:8px;padding:2px 8px;font-size:16px;font-family:var(--zyfont);vertical-align:middle}
.wbody{text-align:center;transform-origin:top center}
.wbody .sent{font-size:34px}.wbody .vert,.wbody .bigexpr{font-size:40px}.wbody .clock{width:160px;height:160px}
.wa{font-size:32px;text-align:center}
.wa .mine{color:#c0504d}.wa .ok{color:#23784f;font-weight:bold}
.wa .plainopt{font-size:40px}
.note{font-family:var(--zyfont);font-size:16px;color:#7a6f96;line-height:1.6}
.settings section{background:#fff;border-radius:20px;padding:16px 22px;margin:14px 0;font-family:var(--zyfont);font-size:18px}
.settings h3{margin:8px 0}
.radio,.chk{display:block;padding:6px 0}
.chk{display:inline-block;margin-right:18px}
.fontbox{margin:8px 0 0 26px}
.fontbox.dim{opacity:.55}
.fontbox input{font-size:18px;padding:6px 10px;border-radius:10px;border:2px solid #ddd;width:260px}
.preview{font-size:40px;margin:10px 0;padding:10px;border:2px dashed #ddd;border-radius:12px}
.okc{color:var(--green)}.badc{color:var(--red)}
@media (max-width:640px){
  .cards{grid-template-columns:1fr}.logo{font-size:40px}.sent{font-size:36px}.opt{font-size:36px;min-height:80px}
  .opts.n3{grid-template-columns:repeat(3,1fr)}.opt.ch{min-width:70px;min-height:80px;font-size:38px}
}
/* ---- v2：新題型 ---- */
.example{font-size:34px;color:#7a6f96;background:#f6f1ff;border-radius:16px;padding:6px 16px;margin:0 auto 10px;display:inline-block}
.qbody .example{display:block;width:fit-content}
.opts.list{grid-template-columns:1fr}
.opts.list .opt{font-size:38px;text-align:left;padding:12px 20px;min-height:84px}
.orderline{min-height:120px;background:#fff;border:4px dashed #ffd6a5;border-radius:24px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;font-size:40px}
.orderline .ph{font-size:24px;color:#b3a9c9}
.chunks{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:16px}
.chunk{background:#fff;border:4px solid #e9e2f5;border-radius:20px;padding:8px 16px;font-size:40px;box-shadow:0 5px 0 #ddd3ee}
.chunk.inline{background:#fff1d6;border-color:#ffb48a;box-shadow:0 4px 0 #f3c99a}
.next:disabled{opacity:.45;cursor:default}
#fixstep{margin-top:16px}
/* ---- v4：考前複習・小考・列印 ---- */
.exambox{background:linear-gradient(135deg,#fff6e0,#ffe9f0);border:4px solid #ffd6a5;border-radius:26px;padding:14px 16px;margin:10px 0 6px;text-align:center}
.examtitle{font-size:34px;font-weight:bold;color:#e8505b}
.examrange{font-family:var(--zyfont);font-size:18px;color:#7a6f96;margin:4px 0 10px}
.exambtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.exbtn.review{grid-column:1/-1;flex-direction:row;justify-content:center;gap:8px;font-size:28px}
.exbtn.print{grid-column:1/-1;flex-direction:row;justify-content:center;gap:8px;padding:6px}
.exbtn{white-space:nowrap}
.exbtn{background:#fff;border:3px solid #ffd6a5;border-radius:18px;padding:10px 6px;font-size:24px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 #f3c99a}
.exbtn small{font-family:var(--zyfont);font-size:14px;opacity:.75}
.exbtn.review{background:#e3f8ec;border-color:#9fdcbc;box-shadow:0 4px 0 #7cc7a0}
.exbtn.print{font-family:var(--zyfont);font-size:20px}
.exbtn:active{transform:translateY(3px)}
.examhist{font-family:var(--zyfont);font-size:15px;color:#7a6f96;margin-top:8px}
.breakdown{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;font-family:var(--zyfont)}
.bd{background:#fff;border-radius:16px;padding:8px 14px;display:flex;flex-direction:column;align-items:center;font-size:18px;border:3px solid #e9e2f5}
.bd span{font-size:26px;font-weight:bold}
.bd.full{border-color:var(--green)}.bd.low{border-color:#f3a6a4;background:#fff4f3}
details.allans{margin:16px 0}
details.allans summary{font-family:var(--zyfont);font-size:22px;cursor:pointer;background:#fff;border-radius:16px;padding:12px 16px;text-align:center}
.witem.okitem{border-left-color:var(--green)}
.review .rvcard{background:#fff;border-radius:24px;padding:14px 20px;margin:16px 0;box-shadow:0 5px 0 rgba(0,0,0,.06);border-top:10px solid var(--pri)}
.review .rvcard.math{border-top-color:var(--blue)}
.review h2{text-align:left;font-size:30px;margin:6px 0}
.review h3{font-family:var(--zyfont);font-size:20px;color:#7a6f96;margin:14px 0 6px}
.rvchars{display:flex;flex-wrap:wrap;gap:8px}
.rvch{font-size:44px;background:#fff8ef;border:2px solid #ffd6a5;border-radius:12px;padding:2px 8px}
.rvch.read{background:#f3f0fa;border-color:#e1d9f3}
.rvwords{display:flex;flex-wrap:wrap;gap:8px}
.rvw{font-size:32px;background:#f6f1ff;border-radius:12px;padding:2px 10px}
.rvw.grp{font-family:var(--kai);font-size:30px}
.rvlist{font-size:22px;line-height:1.8;margin:4px 0;padding-left:1.2em}
.rvlist b{font-size:26px}
.rvex{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.rvexq{background:#f4f8ff;border-radius:16px;padding:10px 16px;text-align:center;font-size:22px}
.rvexq .vert,.rvexq .bigexpr{font-size:44px}.rvexq .sent{font-size:30px}
.rvexq .ok{color:#23784f;font-family:var(--zyfont);font-size:18px;margin-top:6px}
.printpage{background:#fff;border-radius:16px;padding:16px 22px}
.ptitle{text-align:center;font-size:34px;margin:6px 0}
.phead{text-align:center;font-family:var(--zyfont);font-size:18px;margin-bottom:12px}
.pq{border-bottom:1px dashed #ccc;padding:10px 0;break-inside:avoid;page-break-inside:avoid}
.pqt{font-size:22px}
.pq .sent{font-size:30px}.pq .vert,.pq .bigexpr{font-size:36px}.pq .clock{width:150px;height:150px}.pq .example{font-size:22px}
.pq .qbody{text-align:left}
.popts{display:flex;flex-wrap:wrap;gap:6px 24px;font-size:26px;margin-top:4px}
.popts.list{flex-direction:column}
.popts .plainopt{font-size:30px}.popts .zyopt{font-size:26px}
.pfill{font-family:var(--zyfont);font-size:20px;margin-top:6px}
.pkey{break-before:page;page-break-before:always;margin-top:24px}
.pkey h2{text-align:center}
.pans{font-size:22px;line-height:1.9;list-style:none;padding:0;columns:2}
@media print{ .noprint{display:none!important} body{background:#fff!important} .printpage{padding:0} }
@media (max-width:640px){
  .exambtns{gap:6px}.exbtn{font-size:15px;padding:8px 0}.exbtn.review{font-size:24px}.examtitle{font-size:28px}
  .rvch{font-size:36px}.rvw{font-size:26px}.pans{columns:1}
}
.pans .zyopt{font-size:22px}.pans .plainopt{font-size:24px}

</style>
</head>
<body>
<div id="app"></div>
<script>
/* =====================================================================
   題庫資料區（家長可以在這裡新增或修改題目）
   ---------------------------------------------------------------------
   【文字標記規則】
   - 一般國字：程式會自動查下面的 ZY_CHAR（單字）與 ZY_WORD（詞語）字典加上注音。
   - 多音字 / 輕聲：如果某個字在句子裡念法跟字典預設不同，用 {字|注音} 指定，
       例如：請你【數】一{數|ㄕㄨˇ}有幾個蘋果。
     或把整個詞加進 ZY_WORD（例如 "長大": "ㄓㄤˇ ㄉㄚˋ"，注音之間用空白隔開）。
   - ＿ ：填空的位置。
   - 【字】：多音字題目要考的字（會用紅色顯示、不標注音）。
   - 輕聲符號「˙」放在注音前面，例如 ˙ㄉㄜ。聲調用 ˊ ˇ ˋ（一聲不標）。
   - 打開網頁後，如果某個字查不到注音，瀏覽器 Console 會顯示警告。

   【題型格式】
   pick     看注音選國字：{type:'pick', text:'句子，用＿當空格', ans:'正確字', zy:'正確字的注音', opts:['正確字','干擾字',...]}
   wrong    找錯字：     {type:'wrong', text:'有錯字的句子', bad:'錯字', fix:'正確字', zy:'該念的注音', word:'正確的詞'}
   poly     多音字：     {type:'poly', text:'句子，用【字】標出要考的字', ans:'正確注音', opts:['注音1','注音2'], tip:'說明'}
   measure  量詞：       {type:'measure', text:'一＿魚', ans:'條', opts:['條','隻','本','張']}
   opposite 相反詞：     {type:'opposite', word:'大', ans:'小', opts:['小','多','長']}
   ===================================================================== */

// ---- 單字預設讀音（台灣教育部標準，一、不 標本調，和課本相同）----
const ZY_CHAR = {
  "我":"ㄨㄛˇ","你":"ㄋㄧˇ","他":"ㄊㄚ","她":"ㄊㄚ","們":"˙ㄇㄣ","的":"˙ㄉㄜ","了":"˙ㄌㄜ","得":"˙ㄉㄜ","著":"˙ㄓㄜ",
  "是":"ㄕˋ","在":"ㄗㄞˋ","有":"ㄧㄡˇ","不":"ㄅㄨˋ","很":"ㄏㄣˇ","這":"ㄓㄜˋ","哪":"ㄋㄚˇ","什":"ㄕㄣˊ","麼":"˙ㄇㄜ","怎":"ㄗㄣˇ",
  "一":"ㄧ","二":"ㄦˋ","三":"ㄙㄢ","四":"ㄙˋ","五":"ㄨˇ","六":"ㄌㄧㄡˋ","七":"ㄑㄧ","八":"ㄅㄚ","九":"ㄐㄧㄡˇ","十":"ㄕˊ",
  "百":"ㄅㄞˇ","千":"ㄑㄧㄢ","兩":"ㄌㄧㄤˇ","個":"˙ㄍㄜ","幾":"ㄐㄧˇ","第":"ㄉㄧˋ","每":"ㄇㄟˇ","最":"ㄗㄨㄟˋ","又":"ㄧㄡˋ","再":"ㄗㄞˋ",
  "好":"ㄏㄠˇ","大":"ㄉㄚˋ","小":"ㄒㄧㄠˇ","多":"ㄉㄨㄛ","少":"ㄕㄠˇ","上":"ㄕㄤˋ","下":"ㄒㄧㄚˋ","來":"ㄌㄞˊ","去":"ㄑㄩˋ",
  "長":"ㄔㄤˊ","短":"ㄉㄨㄢˇ","高":"ㄍㄠ","矮":"ㄞˇ","胖":"ㄆㄤˋ","瘦":"ㄕㄡˋ","快":"ㄎㄨㄞˋ","慢":"ㄇㄢˋ","冷":"ㄌㄥˇ","熱":"ㄖㄜˋ",
  "涼":"ㄌㄧㄤˊ","冰":"ㄅㄧㄥ","開":"ㄎㄞ","關":"ㄍㄨㄢ","打":"ㄉㄚˇ","門":"ㄇㄣˊ","黑":"ㄏㄟ","白":"ㄅㄞˊ","紅":"ㄏㄨㄥˊ","暗":"ㄢˋ",
  "色":"ㄙㄜˋ","天":"ㄊㄧㄢ","今":"ㄐㄧㄣ","日":"ㄖˋ","早":"ㄗㄠˇ","晚":"ㄨㄢˇ","點":"ㄉㄧㄢˇ","分":"ㄈㄣ","時":"ㄕˊ","鐘":"ㄓㄨㄥ",

// ---------- 注音 ----------
const isCJK = c => /[\u3400-\u9fff\uf900-\ufaff]/.test(c);
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function tokenize(s){
  const out=[]; let i=0;
  while(i<s.length){
    const c=s[i];
    if(c==='{'){ const j=s.indexOf('}',i); const [ch,z]=s.slice(i+1,j).split('|'); out.push({k:'cjk',ch,zy:z}); i=j+1; continue; }
    if(c==='【'){ const j=s.indexOf('】',i); out.push({k:'target',ch:s.slice(i+1,j)}); i=j+1; continue; }
    if(c==='＿'){ out.push({k:'blank'}); i++; continue; }
    if(isCJK(c)){
      let hit=false;
      for(let L=4; L>=2; L--){
        const w=s.substr(i,L);
        if(w.length===L && ZY_WORD[w]){ const zs=ZY_WORD[w].trim().split(/\s+/); for(let t=0;t<L;t++) out.push({k:'cjk',ch:w[t],zy:zs[t]}); i+=L; hit=true; break; }
      }
      if(hit) continue;
      const z=ZY_CHAR[c]; if(!z){ if(!MISSING.has(c)) console.warn('[注音] 字典裡找不到：'+c+'（請加到 ZY_CHAR）'); MISSING.add(c); }
      out.push({k:'cjk',ch:c,zy:z||''}); i++; continue;
    }
    out.push({k:'txt',ch:c}); i++;
  }
  return out;
}
function zyCol(z){
  if(!z) return '';
  let light=false; if(z[0]==='˙'){ light=true; z=z.slice(1); }
  let tone=''; const last=z[z.length-1]; if('ˊˇˋ'.includes(last)){ tone=last; z=z.slice(0,-1); }
  const syms=[...z]; let h='<span class="zb">';
  if(light) h+='<span class="zl">˙</span>';
  syms.forEach((s,i)=>{ h+='<span class="zr">'+s+(i===syms.length-1&&tone?'<span class="zt">'+tone+'</span>':'')+'</span>'; });
  return h+'</span>';
}
function charHTML(ch, zy){
  if(settings.zyMode==='ruby') return '<ruby>'+esc(ch)+'<rt>'+esc(zy||'')+'</rt></ruby>';
  if(settings.zyMode==='font') return '<span class="fz">'+esc(ch)+'</span>';
  return '<span class="zc"><span class="zh">'+esc(ch)+'</span>'+zyCol(zy)+'</span>';
}
function renderTokens(tokens, o={}){
  return tokens.map(t=>{
    if(t.k==='cjk') return charHTML(t.ch, t.zy);
    if(t.k==='target') return '<span class="target nozy">'+esc(t.ch)+'</span>';
    if(t.k==='blank') return '<span class="blank">'+(o.blankZy? '<span class="zc"><span class="zh blankch">&#8203;</span>'+zyCol(o.blankZy)+'</span>' : '')+'</span>';
    return esc(t.ch);
  }).join('');
}
const Z = (s, o) => renderTokens(tokenize(s), o);
// 把空格先填入正確答案查注音（讓前後的詞語讀音正確），再把空格放回去
function fillZy(text, ans, zy){
  const i=text.indexOf('＿'); if(i<0) return text;
  const toks=tokenize(text.replace('＿', '{＃}')); // placeholder
  const filled=tokenize(text.replace('＿', (zy && [...ans].length===1)? '{'+ans+'|'+zy+'}' : ans));
  // 依序對齊：filled 裡對應位置的字讀音
  let out=''; let k=0;
  for(const t of toks){
    if(t.k==='cjk' && t.ch==='＃'){ out+='＿'; k+=[...ans].length; continue; }
    const f=filled[k]; k++;
    if(t.k==='cjk' && f && f.ch===t.ch) out+='{'+t.ch+'|'+f.zy+'}'; else if(t.k==='target') out+='【'+t.ch+'】'; else out+= t.ch||'';
  }
  return out;
}
const plain = s => tokenize(s).map(t=>t.k==='blank'?'＿':(t.ch||'')).join('');

// ---------- 工具 ----------
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick1 = arr => arr[Math.floor(Math.random()*arr.length)];
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function mkOpts(correct, distractors){ const opts=shuffle([correct, ...distractors]); return {options:opts, answer:opts.indexOf(correct)}; }
function numOpts(ans, extra=[], fmt=n=>String(n)){
  const cand=[...extra, ans+1, ans-1, ans+10, ans-10, ans+2, ans-2, ans+9, ans-9, ans+11, ans+5, ans-5, ans+20];
  const ds=[]; const cap = ans<1000? 999 : Infinity;
  for(const c of cand){ if(c>=0 && c<=cap && c!==ans && !ds.includes(c) && Number.isInteger(c)) ds.push(c); }
  const chosen=[...ds.slice(0, extra.filter(e=>e>=0&&e!==ans).length>0?1:0), ...shuffle(ds)].filter((v,i,a)=>a.indexOf(v)===i).slice(0,3);
  return mkOpts(fmt(ans), chosen.map(fmt));
}

// ---------- 國語題目建立 ----------
const TITLES = {pick:'看注音，選出正確的字。', kxpick:'看注音，選出正確的字。', wrong:'哪一個字寫錯了？', poly:'紅色的字要怎麼念？', kxread:'這個字怎麼念？', measure:'選出正確的量詞。', opposite:'選出相反詞。',
  fix:'先找出寫錯的字，再選出正確的字。', similar:'選出正確的字，填進空格。', order:'把詞語排成通順的句子。', pattern:'照樣寫短語：', idiom:'選出適合的成語。', idiomExtra:'選出適合的成語。（課外）', sentpat:'照樣造句：', idiomMean:'這個成語是什麼意思？'};
function buildChinese(it, idx){
  const q={key:'cn-'+idx+'-'+(it.text||it.word||it.example||(it.chunks||[]).join('')||it.idiom), subject:'chinese', type:it.type, title:TITLES[it.type]};
  if(it.lesson) q.lesson=it.lesson;
  q.tg = it.tg || ({fix:it.fix, similar:it.ans, usage:it.word, kxpick:it.ans, pick:it.ans, wrong:it.fix, measure:it.ans, opposite:it.ans}[it.type]) || ((it.text||'').match(/【(.)】/)||[])[1] || it.idiom || '';
  if(it.type==='fix'){
    const bi=it.text.indexOf(it.bad); const good=tokenize(it.text.slice(0,bi)+it.fix+it.text.slice(bi+1)); const toks=tokenize(it.text.replace(it.bad,'{'+it.bad+'|'+it.zy+'}')); const sent=[]; const options=[]; let answer=-1;
    toks.forEach((t,ti)=>{ if(t.k==='cjk'){ const z = (ti===toks.findIndex(x=>x.ch===it.bad))? it.zy : (good[ti]&&good[ti].zy) || t.zy; if(t.ch===it.bad && answer<0) answer=options.length; sent.push({o:options.length}); options.push('{'+t.ch+'|'+z+'}'); } else sent.push({p:t.ch}); });
    const fo=mkOpts(it.fix, it.opts.filter(o=>o!==it.fix));
    Object.assign(q, {body:'', layout:'fix', sentence:sent, options, answer, fixOpts:fo.options, fixAns:fo.answer, fixZy:it.zy});
    q.explain='「'+it.bad+'」要改成「{'+it.fix+'|'+it.zy+'}」：'+it.text.slice(0,bi)+it.fix+it.text.slice(bi+1);
    q.answerText='「'+it.bad+'」→「{'+it.fix+'|'+it.zy+'}」';
    return q;
  }
  if(it.type==='similar'){
    Object.assign(q, {body:fillZy(it.text, it.ans), layout:'grid', noZyOptions:true}, mkOpts(it.ans, it.opts.filter(o=>o!==it.ans)));
    q.explain=it.text.replace('＿', it.ans); return q;
  }
  if(it.type==='usage'){
    Object.assign(q, {title:'「'+it.word+'」用得對的是哪一句？', body:'', layout:'list'}, mkOpts(it.opts[0], it.opts.slice(1)));
    q.explain=it.opts[0]; return q;
  }
  if(it.type==='order'){
    Object.assign(q, {body:'', layout:'order', chunks:it.chunks, alts:it.alts||[], options:it.chunks.slice(), answer:-1});
    q.explain=it.chunks.join('')+'。'; q.answerText=q.explain; return q;
  }
  if(it.type==='pattern'){
    const long=it.opts.some(o=>o.length>3);
    Object.assign(q, {example:it.example, body:fillZy(it.text, it.ans), layout: long?'list':'grid'}, mkOpts(it.ans, it.opts.filter(o=>o!==it.ans)));
    q.explain = it.text.includes('＿')? it.text.replace('＿', it.ans) : it.ans; return q;
  }
  if(it.type==='sentpat'){
    Object.assign(q, {title:'照樣造句：「'+it.pat+'」', example:it.example, body:'選出跟例子寫法一樣、意思也通順的句子。', layout:'list'}, mkOpts(it.ans, it.opts.filter(o=>o!==it.ans)));
    q.explain=it.ans; return q;
  }
  if(it.mode==='mean'){
    Object.assign(q, {title:'「'+it.idiom+'」是什麼意思？', body:'', layout:'list', meanQ:true}, mkOpts(it.mean, it.opts.filter(o=>o!==it.mean)));
    q.key='cn-'+idx+'-mean-'+it.idiom; q.explain='「'+it.idiom+'」：'+it.mean; return q;
  }
  if(it.type==='idiom' || it.type==='idiomExtra'){
    Object.assign(q, {body:fillZy(it.sentence, it.idiom), layout:'list'}, mkOpts(it.idiom, it.opts.filter(o=>o!==it.idiom)));
    q.explain=it.sentence.replace('＿', it.idiom)+(it.mean? '（'+it.idiom+'：'+it.mean+'）' : ''); return q;
  }
  if(it.type==='kxpick'){ return Object.assign(buildChinese(Object.assign({}, it, {type:'pick'}), idx), {type:'kxpick', lesson:it.lesson, tg:it.tg}); }
  if(it.type==='kxread'){ return Object.assign(buildChinese(Object.assign({}, it, {type:'poly'}), idx), {type:'kxread', title:TITLES.kxread, lesson:it.lesson, tg:it.tg}); }
  if(it.type==='pick'){
    Object.assign(q, {body:fillZy(it.text, it.ans, it.zy), blankZy:it.zy, layout:'grid', noZyOptions:true}, mkOpts(it.ans, it.opts.filter(o=>o!==it.ans)));
    q.explain = '正確答案：'+'{'+it.ans+'|'+it.zy+'}'+'　'+it.text.replace('＿','{'+it.ans+'|'+it.zy+'}');
  } else if(it.type==='wrong'){
    const toks=tokenize(it.text.replace(it.bad,'{'+it.bad+'|'+it.zy+'}')); const sent=[]; const options=[]; let answer=-1;
    toks.forEach(t=>{
      if(t.k==='cjk'){ const z=(t.ch===it.bad)? it.zy : t.zy; if(t.ch===it.bad) answer=options.length; sent.push({o:options.length}); options.push('{'+t.ch+'|'+z+'}'); }
      else sent.push({p:t.ch});
    });
    Object.assign(q, {body:'', layout:'sentence', sentence:sent, options, answer});
    q.explain = '「{'+it.bad+'|'+it.zy+'}」要改成「{'+it.fix+'|'+it.zy+'}」：'+it.word;
  } else if(it.type==='poly'){
    Object.assign(q, {body:it.text, layout:'zhuyin'}, mkOpts(it.ans, it.opts.filter(o=>o!==it.ans)));
    q.explain = it.tip;
  } else if(it.type==='measure'){
    Object.assign(q, {body:fillZy(it.text, it.ans), layout:'grid'}, mkOpts(it.ans, it.opts.filter(o=>o!==it.ans)));
    q.explain = it.text.replace('＿', it.ans);
  } else if(it.type==='opposite'){
    Object.assign(q, {body:'「'+it.word+'」的相反詞是？', layout:'grid'}, mkOpts(it.ans, it.opts.filter(o=>o!==it.ans)));
    q.explain = it.word+' ↔ '+it.ans;
  }
  return q;
}

// ---------- 數學題目產生 ----------
function digitsNoCarry(a,b,op){ // 常見錯誤：忘記進位/退位
  const A=String(a).split('').reverse(), B=String(b).split('').reverse(); let r=[];
  for(let i=0;i<Math.max(A.length,B.length);i++){ const x=+(A[i]||0), y=+(B[i]||0); r.push(op==='+'? (x+y)%10 : Math.abs(x-y)); }
  return +r.reverse().join('');
}
function genMath(type){
  const q={subject:'math', type, layout:'grid'};
  if(/^n[12]/.test(type)) return genNani(type, q);
  if(type==='add' || type==='sub'){
    let a,b; const three=Math.random()<0.45;

      q.ans=a+b;
    } else {
      if(three){ a=rnd(150,999); b=rnd(10,a-10); } else { a=rnd(20,99); b=rnd(10,a-1); }
      q.ans=a-b;
    }
    const op = type==='add'?'+':'−';
    Object.assign(q, {title:'請算出答案。', vertical:{a, b, op}, body:''}, numOpts(q.ans, [digitsNoCarry(a,b,type==='add'?'+':'-')]));
    q.key='m-'+type+a+op+b; q.explain=a+' '+op+' '+b+' = '+q.ans;
  } else if(type==='mul'){
    const a=rnd(2,9), b=rnd(1,9), c=a*b;
    if(Math.random()<0.7){
      Object.assign(q, {title:'請算出答案。', bodyBig:a+' × '+b+' = ？'}, numOpts(c, [a*(b+1), a*(b-1), (a+1)*b, a+b]));
    } else {
      Object.assign(q, {title:'（　）裡要填多少？', bodyBig:'（　） × '+b+' = '+c}, numOpts(a, [a+1, a-1, b]));
      q.ans=a;
    }
    q.key='m-mul'+a+'x'+b+(q.bodyBig[0]); q.explain=a+' × '+b+' = '+c;
  } else if(type==='word'){
    const t=pick1(WORD_TEMPLATES); const [N,P]=pick1(NAMES);
    let a=rnd(t.a[0],t.a[1]), b=rnd(t.b[0],t.b[1]);
    if(t.op==='-' && b>=a) b=rnd(1,a-1);
    const ans = t.op==='+'? a+b : t.op==='-'? a-b : a*b;
    const text=t.text.replace(/\{N\}/g,N).replace(/\{P\}/g,P).replace('{a}',a).replace('{b}',b);
    const extra = t.op==='*'? [a+b, a*(b+1)] : t.op==='+'? [Math.abs(a-b), digitsNoCarry(a,b,'+')] : [a+b, digitsNoCarry(a,b,'-')];
    Object.assign(q, {title:'讀題目，算出答案。', body:text}, numOpts(ans, extra));
    q.key='m-word'+text; q.explain = a+' '+({'+':'+','-':'−','*':'×'}[t.op])+' '+b+' = '+ans;
  } else if(type==='time'){
    if(Math.random()<0.7){
      const h=rnd(1,12), m=rnd(0,11)*5; const f=(H,M)=> H+' 點'+(M===0?'整':' '+M+' 分');
      const right=f(h,m); const cands=[];
      const add=s=>{ if(s!==right && !cands.includes(s)) cands.push(s); };
      add(f(h%12+1, m)); add(f(h===1?12:h-1, m)); if(m>=5) add(f(h, m/5)); add(f(h,(m+30)%60)); if(m/5>=1 && m/5<=12) add(f(m/5, (h*5)%60));
      add(f(h,(m+5)%60));
      Object.assign(q, {title:'時鐘上是幾點幾分？', clock:{h,m}, body:''}, mkOpts(right, shuffle(cands).slice(0,3)));
      q.key='m-time'+h+':'+m; q.explain='時鐘上是 '+right;
    } else {
      const h=rnd(1,9), d=rnd(1,3); const right=(h+d)+' 點';
      Object.assign(q, {title:'讀題目，算出答案。', body:'現在是 '+h+' 點，再過 '+d+' 小時是幾點？'}, mkOpts(right, shuffle([(h+d+1)+' 點', (h+d-1)+' 點', (h-d>0? h-d : h+d+2)+' 點']).slice(0,3)));
      q.key='m-timeadd'+h+'+'+d; q.explain=h+' 點 + '+d+' 小時 = '+right;
    }
  } else if(type==='money'){
    if(Math.random()<0.6){
      let list=[]; do{ list=[]; [[100,rnd(0,1)],[50,rnd(0,1)],[10,rnd(0,4)],[5,rnd(0,1)],[1,rnd(0,4)]].forEach(([v,n])=>{ for(let i=0;i<n;i++) list.push(v); }); }while(list.length<2);
      const sum=list.reduce((s,v)=>s+v,0);

      q.key='m-money'+list.join(','); q.explain='一共 '+sum+' 元';

      q.key='m-change'+p; q.explain='100 − '+p+' = '+ans+'（元）';
    }
  } else if(type==='length'){
    const r=Math.random();
    if(r<0.4){
      const items=[['一枝鉛筆大約長 15','公分'],['一扇門大約高 2','公尺'],['一張書桌大約長 1','公尺'],['一個橡皮擦大約長 4','公分'],['一棵大樹大約高 8','公尺'],['一本課本大約長 26','公分'],['教室大約長 9','公尺'],['一張紙大約長 30','公分']];
      const [t,u]=pick1(items);
      Object.assign(q, {title:'（　）裡要填哪一個單位？', body:t+'（　）。'}, mkOpts(u, [u==='公分'?'公尺':'公分']));
      q.key='m-unit'+t; q.explain=t+' '+u+'。';
    } else if(r<0.7){
      const a=rnd(1,90);
      Object.assign(q, {title:'請算出答案。', body:'1 公尺 '+a+' 公分是幾公分？'}, numOpts(100+a, [10+a, 1+a, 100+a+10], n=>n+' 公分'));
      q.key='m-conv'+a; q.explain='1 公尺 = 100 公分，100 + '+a+' = '+(100+a)+' 公分';
    } else {
      const a=rnd(30,99), b=rnd(5,a-5);
      Object.assign(q, {title:'讀題目，算出答案。', body:'一條繩子長 '+a+' 公分，剪掉 '+b+' 公分，還剩下幾公分？'}, numOpts(a-b, [a+b, digitsNoCarry(a,b,'-')], n=>n+' 公分'));
      q.key='m-rope'+a+'-'+b; q.explain=a+' − '+b+' = '+(a-b)+'（公分）';
    }
  }
  return q;
}

// ---------- 題組 ----------
function enabled(list){ const k=list.filter(t=>settings.types[t.key]).map(t=>t.key); return k.length? k : list.map(t=>t.key); }
function chineseQuestions(n){
  const types=enabled(CN_TYPES);
  const pool=BANK_CHINESE.map((it,i)=>({it,i})).filter(x=>types.includes(x.it.type));
  let out=[]; while(out.length<n){ out=out.concat(shuffle(pool)); }
  return out.slice(0,n).map(x=>buildChinese(x.it, x.i));
}
function mathQuestions(n, units){
  units = units || mathUnitSel();
  const inUnits=MATH_TYPES.filter(t=>units.includes(t.unit));
  const types=enabled(inUnits.length? inUnits : MATH_TYPES); const out=[]; const seen=new Set(); let guard=0;
  while(out.length<n && guard++<500){ const q=genMath(types[out.length % types.length === 0 ? rnd(0,types.length-1) : rnd(0,types.length-1)]); if(seen.has(q.key)) continue; seen.add(q.key); out.push(q); }
  return shuffle(out);
}
// ---- 課程範圍 ----
function lessonSel(){ return (settings.lessons&&settings.lessons.length)? settings.lessons.slice().sort((a,b)=>a-b) : [1]; }
function lessonChars(ls){ return new Set(ls.flatMap(n=>[...KX2A_LESSONS[n-1].chars, ...KX2A_LESSONS[n-1].read])); }
function lessonWords(ls){ return new Set(ls.flatMap(n=>KX2A_LESSONS[n-1].words.map(w=>w[0]))); }
function allowedChars(maxL){ const s=new Set(KX_G1); for(let n=1;n<=maxL;n++){ [...KX2A_LESSONS[n-1].chars, ...KX2A_LESSONS[n-1].read].forEach(c=>s.add(c)); } return s; }
const cjkOf = s => (s||'').replace(/\|[^}]*\}/g,'').replace(/【|】|[{}]/g,'').split('').filter(isCJK);
// 成語干擾選項：同課優先，再用前面的課（不用後面的課）；意思太接近的（avoid）不當干擾選項
function idiomDistract(d, same, earlier, key){
  const bad=new Set([d.idiom, ...(d.avoid||[])]); [...same, ...earlier].forEach(x=>{ if((x.avoid||[]).includes(d.idiom)) bad.add(x.idiom); });
  const pick=arr=>shuffle(arr.filter(x=>!bad.has(x.idiom)));
  const c=[...pick(same), ...pick(earlier)]; const outp=[]; c.forEach(x=>{ const v=x[key]; if(!outp.includes(v) && outp.length<2) outp.push(v); });
  return outp;
}
function idiomItems(ls, mode){
  const out=[]; const maxL=Math.max(...ls);
  ls.forEach(n=>{ const list=KX2A_IDIOMS[n]||[]; const earlier=[]; for(let k=1;k<=maxL;k++){ if(k!==n) earlier.push(...(KX2A_IDIOMS[k]||[]).filter(()=>k<n || ls.includes(k))); }
    list.forEach(d=>{ const key= mode==='mean'? 'mean' : 'idiom'; const ds=idiomDistract(d, list, earlier, key); if(ds.length<1) return;
      out.push(Object.assign({}, d, {type: mode==='mean'?'idiomMean':'idiom', mode, lesson:n, tg:d.idiom, opts:[d[key], ...ds]})); }); });
  return out;
}
function idiomExtraItems(){ const out=[]; ['fill','mean'].forEach(mode=>IDIOMS_EXTRA.forEach(d=>{ const key=mode==='mean'?'mean':'idiom'; out.push(Object.assign({}, d, {type:'idiomExtra', mode, extra:true, opts:[d[key], ...idiomDistract(d, IDIOMS_EXTRA, [], key)]})); })); return out; }
function genericFits(it, ls){
  const maxL=Math.max(...ls), allow=allowedChars(maxL), lc=lessonChars(ls);
  const q=buildChinese(it, 'g');
  const tg=q.tg; if(!tg || ![...tg].every(c=>lc.has(c))) return false;
  const txt=[q.body, q.explain, ...(q.options||[]), ...(q.fixOpts||[])].join('');
  return cjkOf(txt).every(c=>allow.has(c));
}
function kxPool(ls){
  const t=settings.types, pool=[];
  BANK_KX2A_AUTO.forEach((it,i)=>{ if(ls.includes(it.lesson) && t[it.type]!==false) pool.push(buildChinese(it,'kxa'+i)); });
  KX2A_MANUAL.forEach((it,i)=>{ if(ls.includes(it.lesson) && t[it.type]!==false) pool.push(buildChinese(it,'kxm'+i)); });
  if(t.idiom!==false) idiomItems(ls,'fill').forEach((it,i)=>pool.push(buildChinese(it,'kxi'+i)));
  if(t.idiomMean!==false) idiomItems(ls,'mean').forEach((it,i)=>pool.push(buildChinese(it,'kxim'+i)));
  if(t.idiomExtra) idiomExtraItems().forEach((it,i)=>pool.push(buildChinese(it,'kxe'+i)));
  if(t.generic!==false) BANK_CHINESE.forEach((it,i)=>{ if(genericFits(it, ls)){ const q=buildChinese(it,i); q.generic=true; pool.push(q); } });
  return pool;
}
function kxQuestions(n, ls){
  const pool=kxPool(ls || lessonSel()); if(!pool.length) return [];
  // 各題型輪流出題，避免某一種題型太多
  const by={}; pool.forEach(q=>{ (by[q.type]=by[q.type]||[]).push(q); });
  Object.keys(by).forEach(k=>by[k]=shuffle(by[k]));
  const out=[]; let types=shuffle(Object.keys(by)); const used={}; let guard=0;
  while(out.length<n && guard++<5000){ for(const k of types){ if(out.length>=n) break; const arr=by[k]; const i=(used[k]=(used[k]||0)+1)-1; out.push(reshuffle(arr[i % arr.length])); } types=shuffle(types); }
  return shuffle(out);
}
function makeSet(subject, n){
  if(subject==='kx' || subject==='chinese') return kxQuestions(n);
  if(subject==='math') return mathQuestions(n);
  const a=kxQuestions(Math.ceil(n/2)), b=mathQuestions(n-a.length); const out=[];
  for(let i=0;i<n;i++){ const s=(i%2===0? a:b).shift() || a.shift() || b.shift(); if(s) out.push(s); }
  return out;
}

function fixStep1(i, btn){
  const q=S.questions[S.idx]; if(S.locked || S.fixStep!==1) return;
  const ch=plain(q.options[i]);
  if(i===q.answer){
    btn.classList.add('picked'); S.fixStep=2; $('#fixstep').classList.remove('hidden');
    const fb=$('#fb'); fb.className='feedback good'; fb.innerHTML='👍 '+Z('找到了！再選出正確的字。'); return;
  }
  if(S.mode==='test'){ btn.classList.add('picked'); finishQ(false, '點了「'+ch+'」'); return; }
  btn.classList.add('wrong','shake'); S.mistake=true; S.tries++;
  const fb=$('#fb'); fb.className='feedback soft';
  if(S.tries>=2){ const t=app().querySelector(`.opt.ch[data-i="${q.answer}"]`); t.classList.add('picked'); S.fixStep=2; $('#fixstep').classList.remove('hidden'); fb.innerHTML='💡 '+Z('寫錯的是這個字，再選出正確的字。'); }
  else fb.innerHTML='🤔 '+Z(pick1(TRY));
}
function fixStep2(j, btn){
  const q=S.questions[S.idx]; if(S.locked || S.fixStep!==2) return;
  const bad=plain(q.options[q.answer]);
  if(j===q.fixAns){ btn.classList.add('right'); finishQ(!S.mistake, '「'+bad+'」→「'+q.fixOpts[j]+'」'); return; }
  if(S.mode==='test'){ btn.classList.add('picked'); finishQ(false, '「'+bad+'」→「'+q.fixOpts[j]+'」'); return; }
  btn.classList.add('wrong','shake'); btn.disabled=true; S.mistake=true; S.tries2++;
  if(S.tries2>=1){ app().querySelector(`.fopt[data-j="${q.fixAns}"]`).classList.add('right'); finishQ(false, '「'+bad+'」→「'+q.fixOpts[j]+'」'); }

  for(let i=1;i<=12;i++){ const a=i*30*Math.PI/180; s+=`<text x="${100+66*Math.sin(a)}" y="${100-66*Math.cos(a)+7}" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">${i}</text>`; }
  const ha=((h%12)+m/60)*30, ma=m*6;
  s+=`<line x1="100" y1="100" x2="${100+42*Math.sin(ha*Math.PI/180)}" y2="${100-42*Math.cos(ha*Math.PI/180)}" stroke="#e8505b" stroke-width="8" stroke-linecap="round"/>`;

  return s+'<circle cx="100" cy="100" r="6" fill="#333"/></svg><div class="legend"><span style="color:#e8505b">● 短針（時）</span>　<span style="color:#2d6cdf">● 長針（分）</span></div>';
}

      let ex=(q.explain||'').replace(/正確答案：|要改成/g,''); let bodyC=((q.type==='pattern'||q.type==='sentpat')&&!(q.body||'').includes('＿'))?'':q.body; // 純指示語不算

      }

      const badChar = q.layout==='fix'? plain(q.options[q.answer]) : '';

      if(!isIdiom) ds.forEach(d=>cjkOf(d).forEach(c=>{ if(!allow.has(c)){ const tgt = wb.has(c)? wbUsed : distr; (tgt[q.type]=tgt[q.type]||new Set()).add(c); } }));
    });

  }

function genNani(type, q){
  if(type==='n1seq'){
    let seq, step, dir, g=0;
    do{
      step = Math.random()<0.5? 1 : 10; dir = Math.random()<0.7? 1 : -1;
      let s0;
      if(step===1){ const pivot=pick1([100,200,300,rnd(2,29)*10]); s0 = dir>0? pivot-rnd(1,3) : pivot+rnd(1,3); }
      else s0 = rnd(0,29)*10 + (Math.random()<0.5? 0 : rnd(1,9));
      seq=[0,1,2,3].map(i=>s0+dir*step*i);
    } while(seq.some(v=>v<1||v>300) && g++<50);
    const hole=rnd(0,3), ans=seq[hole];
    Object.assign(q, {title:'照順序，（　）裡要填多少？', bodyBig:seq.map((v,i)=>i===hole?'（　）':v).join('、')}, numOpts(ans, [ans+dir*(step===1?10:1)]));
    q.key='m-n1seq'+seq.join(',')+'#'+hole; q.explain=(dir>0?'每次多 ':'每次少 ')+step+'：'+seq.join('、'); q.check={kind:'seq', seq, hole, ans};
    return q;
  }

      let h,t,o; if(v===1){ if(Math.random()<0.1){ h=3;t=0;o=0; } else { h=rnd(1,2); t=rnd(0,9); o=rnd(0,9); } } else { h=rnd(0,2); t=rnd(0,8); o=rnd(10,19); }
      const ans=100*h+10*t+o; const parts=[h?h+' 個百':'', t?t+' 個十':'', o?o+' 個一':''].filter(Boolean);
      const body=parts.length>1? parts.slice(0,-1).join('、')+'和 '+parts[parts.length-1]+'合起來是多少？' : parts[0]+'是多少？';
      Object.assign(q, {title:'算算看。', body}, numOpts(ans, v===2? [100*h+10*t+(o%10)] : [100*h+10*o+t]));
      q.key='m-n1pl'+h+'-'+t+'-'+o; q.explain=(h?h+' 個百是 '+(100*h)+'，':'')+(t?t+' 個十是 '+(10*t)+'，':'')+(o?o+' 個一是 '+o+'，':'')+'合起來是 '+ans; q.check={kind:'compose', h,t,o, ans};
    } else if(v===3){
      const n=rnd(10,30), ans=n*10;
      Object.assign(q, {title:'算算看。', body:n+' 個十是多少？'}, numOpts(ans, [n, ans+10]));
      q.key='m-n1ten'+n; q.explain='10 個十是 100，'+n+' 個十是 '+ans; q.check={kind:'tens', n, ans};
    } else if(v===4){
      const num=rnd(100,300), ds=String(num).split('').map(Number), names=['百位','十位','個位'], pi=rnd(0,2), ans=ds[pi];
      const cand=[...new Set([...ds, ans+1, ans===0?2:ans-1, (ans+5)%10])].filter(d=>d!==ans && d>=0 && d<=9).slice(0,3);
      Object.assign(q, {title:'算算看。', body:num+' 的「'+names[pi]+'」是多少？'}, mkOpts(String(ans), cand.map(String)));
      q.key='m-n1dig'+num+pi; q.explain=num+'：百位是 '+ds[0]+'，十位是 '+ds[1]+'，個位是 '+ds[2]; q.check={kind:'digit', num, pi, ans};
    } else if(v===5){
      let num, pi, d, g=0; do{ num=rnd(100,300); pi=rnd(0,1); d=+String(num)[pi]; } while(d===0 && g++<50);
      const val=d*(pi===0?100:10), names=['百位','十位'];
      Object.assign(q, {title:'算算看。', body:num+' 的'+names[pi]+'上的 '+d+' 代表多少？'}, mkOpts(String(val), [String(d), String(pi===0? d*10 : d*100)]));
      q.key='m-n1val'+num+pi; q.explain=names[pi]+'上的 '+d+' 代表 '+d+' 個'+(pi===0?'百':'十')+'，就是 '+val; q.check={kind:'value', num, pi, ans:val};
    } else {

      const f=(a,b,c)=>a+' 個百、'+b+' 個十、'+c+' 個一';
      const right=f(h,t,o); const ds=[...new Set([f(h,o,t), f(t,h,o), f(o,t,h), f(h,t,(o+1)%10)])].filter(x=>x!==right).slice(0,2);

      const big=Math.random()<0.5, h=rnd(1,2)*100; const ns=new Set(); while(ns.size<3) ns.add(h+rnd(0,99)); const arr=[...ns]; const ans=big? Math.max(...arr) : Math.min(...arr);
      Object.assign(q, {title:'哪一個數'+(big?'最大':'最小')+'？', body:''}, mkOpts(String(ans), arr.filter(x=>x!==ans).map(String)));
      q.key='m-n1ext'+arr.join(',')+big; q.explain=arr.slice().sort((x,y)=>big?y-x:x-y).join(big?' ＞ ':' ＜ '); q.check={kind:'extreme', arr, big, ans};
    }
    return q;
  }
  if(type==='n2add'){
    const kind=pick1(['none','ones','tens','both','both']); let a,b,g=0;
    const cls=(a,b)=>{ const c1=(a%10+b%10)>=10, c2=(Math.floor(a/10)+Math.floor(b/10)+(c1?1:0))>=10; return c1&&c2?'both':c1?'ones':c2?'tens':'none'; };
    do{ a=rnd(10,99); b= Math.random()<0.15? rnd(2,9) : rnd(10,99); } while(cls(a,b)!==kind && g++<500);
    const ans=a+b, k=cls(a,b);
    Object.assign(q, {title:'用直式算算看。', vertical:{a, b, op:'+'}, body:''}, numOpts(ans, [digitsNoCarry(a,b,'+')]));
    q.key='m-n2add'+a+'+'+b; q.explain=a+' + '+b+' = '+ans+({none:'', ones:'（個位滿 10，進 1 到十位）', tens:'（十位滿 10，進 1 到百位）', both:'（個位進 1 到十位，十位再進 1 到百位）'}[k]); q.check={kind:'add', a, b, ans};
    return q;
  }
  if(type==='n2sub'){
    const borrow=Math.random()<0.6; let a,b,g=0;
    do{ a=rnd(20,99); b= Math.random()<0.2? rnd(2,9) : rnd(10,a-1); } while((((b%10)>(a%10))!==borrow || b>=a) && g++<500);
    const ans=a-b, br=(b%10)>(a%10);
    Object.assign(q, {title:'用直式算算看。', vertical:{a, b, op:'−'}, body:''}, numOpts(ans, [digitsNoCarry(a,b,'-')]));
    q.key='m-n2sub'+a+'-'+b; q.explain=a+' − '+b+' = '+ans+(br?'（個位不夠減，從十位借 1 個十）':''); q.check={kind:'sub', a, b, ans};
    return q;
  }
  if(type==='n2word'){
    const t=pick1(NANI_WORD), [N,P]=pick1(NAMES); let a,b;
    if(t.op==='+'){ a=rnd(10,99); b=rnd(10,99); } else { a=rnd(21,99); b=rnd(10,a-1); }
    const ans = t.op==='+'? a+b : a-b;
    const text=t.text.replace(/\{N\}/g,N).replace(/\{P\}/g,P).replace('{a}',a).replace('{b}',b);
    Object.assign(q, {title:'讀題目，算出答案。', body:text}, numOpts(ans, t.op==='+'? [a-b>0?a-b:b-a, digitsNoCarry(a,b,'+')] : [a+b, digitsNoCarry(a,b,'-')]));
    q.key='m-n2word'+text; q.explain=a+' '+(t.op==='+'?'+':'−')+' '+b+' = '+ans; q.check={kind:'word', a, b, op:t.op, ans};
    return q;
  }
  return q;
}

// ---------- 小考題組 ----------
function dedupe(arr){ const seen=new Set(); return arr.filter(q=>{ if(seen.has(q.key)) return false; seen.add(q.key); return true; }); }
function examKx(n){
  const ls=settings.exam.kx.slice().sort((a,b)=>a-b); const out=[];
  ls.forEach((l,i)=>{ const quota=Math.floor(n/ls.length)+(i<n%ls.length?1:0); out.push(...kxQuestions(quota+3,[l]).slice(0,quota+3)); });
  // 每課平均，去掉重複，再補足
  let res=[]; const by={}; dedupe(out).forEach(q=>(by[q.lesson]=by[q.lesson]||[]).push(q));
  let guard=0; while(res.length<n && guard++<100){ ls.forEach(l=>{ if(res.length<n && by[l] && by[l].length) res.push(by[l].shift()); }); if(ls.every(l=>!by[l]||!by[l].length)) break; }
  if(res.length<n) res=res.concat(kxQuestions(n-res.length, ls));
  return shuffle(res.slice(0,n));
}
function examMath(n){ return mathQuestions(n, settings.exam.math.filter(u=>u>0).length? settings.exam.math : [1,2]); }
function examSet(kind, n){
  n=n||20;
  if(kind==='kx') return examKx(n);
  if(kind==='math') return examMath(n);
  const a=examKx(Math.ceil(n/2)), b=examMath(n-a.length), out=[];
  for(let i=0;i<n;i++){ const s=(i%2===0? a:b).shift() || a.shift() || b.shift(); if(s) out.push(s); }
  return out;
}

}

// ---------- 重點複習頁 ----------
function wordZy(w){ const zs=w[1].trim().split(/\s+/); return [...w[0]].map((c,i)=>'{'+c+'|'+(zs[i]||'')+'}').join(''); }
// 單字卡的注音：先用自動題的讀音，再用本課語詞裡的讀音；輕聲（˙）改用字的本音
function charZy(l, c){
  const ok=z=>z && z[0]!=='˙';
  const it=BANK_KX2A_AUTO.find(x=>x.type==='kxread' && x.lesson===l && x.tg===c); if(it && ok(it.ans)) return it.ans;
  for(const w of KX2A_LESSONS[l-1].words){ const i=[...w[0]].indexOf(c); if(i>=0){ const z=w[1].trim().split(/\s+/)[i]; if(ok(z)) return z; } }
  return ZY_CHAR[c]||'';
}

  const mathHTML = e.math.filter(u=>u>0).map(u=>{ const U=NANI_UNITS.find(x=>x.unit===u); if(!U) return '';

// ---------- 列印考卷（附解答） ----------
const LETTERS='ABCDEFG';
function printQHTML(q, i){
  let h=`<div class="pq"><div class="pqt"><b>${i+1}.</b> ${Z(q.title)}</div>`;
  if(q.layout==='fix'){ h+=q2sent(q)+`<div class="pfill">寫錯的字：＿＿＿　改成：＿＿＿</div>`; }
  else if(q.layout==='sentence'){ h+=q2sent(q)+`<div class="pfill">寫錯的字：＿＿＿</div>`; }
  else if(q.layout==='order'){ h+='<div class="sent">'+shuffle(q.chunks).map(c=>Z(c)).join('　／　')+'</div><div class="pfill">＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿</div>'; }
  else { h+=`<div class="qbody">${bodyHTML(q)}</div><div class="popts ${q.layout}">${q.options.map((o,j)=>`<span class="popt">（${LETTERS[j]}）${optHTML(q,o)}</span>`).join('')}</div>`; }
  return h+'</div>';
}
function printAnsHTML(q, i){
  let a;
  if(q.layout==='fix' || q.layout==='order') a=Z(q.answerText||q.explain);
  else if(q.layout==='sentence') a=Z(q.explain);
  else a='（'+LETTERS[q.answer]+'）'+optHTML(q, q.options[q.answer])+(q.subject==='math'&&q.explain? '　'+esc(q.explain) : '');
  return `<li><b>${i+1}.</b> ${a}</li>`;
}
